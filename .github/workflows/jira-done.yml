
name: Move Jira SMS-5 to Done

on:
  pull_request:
    types: [closed]

jobs:
  update-jira:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.title, 'SMS-5')
    runs-on: ubuntu-latest

    steps:
      - name: Move Jira issue to Done
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          curl -sS -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"transition":{"id":"31"}}' \
            "$JIRA_BASE_URL/rest/api/3/issue/SMS-5/transitions"
